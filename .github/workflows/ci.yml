name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -p 'test_*.py'

  browser:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Start the dev server
        run: |
          npx vite --host 127.0.0.1 --port 5174 --strictPort --no-open > vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5174/ > /dev/null && exit 0; sleep 1; done
          cat vite.log; exit 1
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
