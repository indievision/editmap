<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EditMap — Dark Screening single-header mockup</title>
  <style>
    :root{color-scheme:dark;--bg:#060709;--line:#283038;--text:#e9eceb;--muted:#a5b0b1;--amber:#edbd58;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-width:1200px;background:var(--bg);color:var(--text)}button{font:inherit;cursor:default}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}.app{min-height:1051px;overflow:hidden}
    .app-header{height:64px;padding:0 28px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;background:#101318;border-bottom:1px solid #252a33}
    .header-left,.header-right,.brand,.project-pill,.mode-switch{display:flex;align-items:center}.header-left{gap:14px;min-width:0}.header-right{justify-self:end;gap:10px}.brand{gap:12px;white-space:nowrap}.brand-mark{width:30px;height:30px;border:2px solid #d3b36c;border-radius:4px;padding:4px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.brand-mark i{border-left:1px solid #d3b36c}.brand-name{color:#f2f0e9;font-size:14px;font-weight:750;letter-spacing:.21em}.brand-sep{width:1px;height:22px;background:#353b44}.change-film{height:35px;display:flex;align-items:center;gap:9px;padding:0 11px;border:1px solid #3c4650;border-radius:6px;background:#1b2229;color:#dbe2e3;font-size:12px;font-weight:650;white-space:nowrap}.change-film svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.project-pill{height:35px;max-width:310px;border:1px solid #353b45;border-radius:6px;background:#191d24;gap:12px;padding:0 12px;color:#e8ebec;font-size:13px;font-weight:650}.project-pill .chev{color:#808c94}.save{display:flex;align-items:center;gap:7px;border:1px solid #6b542c;border-radius:5px;background:#2d2618;color:#efc36b;padding:6px 9px;font-size:11px;font-weight:700}.save i{width:6px;height:6px;border-radius:50%;background:#e9bc58}
    .mode-switch{justify-self:center;gap:4px;padding:4px;border:1px solid #2a303a;border-radius:8px;background:#0b0d11}.mode-switch span{padding:8px 14px;border-radius:5px;color:#9198a4;font-size:12px;font-weight:550}.mode-switch .active{background:#2b3139;color:#f4f5f6;font-weight:680}.header-action{height:34px;padding:0 14px;border:1px solid #353b45;border-radius:6px;background:#191d24;color:#c8cdd1;font-size:12px;font-weight:580}.header-action.analyzing{color:#a6adb5}.header-action.analyzing i{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#d1a95b}.header-action.file{color:#e4e7e9}
    main{min-height:987px;display:flex;flex-direction:column;align-items:center;padding-top:213px;background:var(--bg)}.screening{width:870px}.screening h1{margin:0;color:#e9edeb;font-size:30px;font-weight:665;letter-spacing:-.03em;line-height:1.15}.lead{margin:11px 0 0;color:#a1acae;font-size:14px;line-height:1.5}.keys-caption{display:flex;justify-content:space-between;align-items:baseline;margin:52px 0 15px}.keys-caption strong{color:#cbd4d4;font-size:12px;font-weight:720;letter-spacing:.08em}.keys-caption span{color:#9ca8aa;font-size:12px}.keys-caption b{color:#e6b86a;font-weight:700}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.key{height:100px;display:flex;align-items:center;justify-content:center;gap:16px;border:1px solid #334047;border-radius:8px;background:#101619}.key span{color:#eff2f0;font-size:38px;line-height:1;font-weight:650}.key i{width:11px;height:11px;border-radius:50%;background:var(--key)}.one{--key:#ef5578}.two{--key:#efbb4a}.three{--key:#47cda0}.four{--key:#46cde0}
    .timeline{margin-top:42px;padding-top:23px;border-top:1px solid #2b363b}.times{display:flex;align-items:baseline;justify-content:space-between}.times .current{color:#edbd58;font-size:16px;font-weight:720}.times .duration{color:#a5b0b1;font-size:13px}.scrub{height:18px;margin-top:12px;position:relative}.track{position:absolute;top:7px;left:0;right:0;height:4px;border-radius:4px;background:#37434a}.progress{position:absolute;top:7px;left:0;width:8px;height:4px;border-radius:4px;background:#e7b754}.playhead{position:absolute;top:1px;left:8px;width:16px;height:16px;border:4px solid #e7b754;border-radius:50%;background:#101617;transform:translateX(-50%)}.transport{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px}.transport .step{height:44px;min-width:100px;border:1px solid #3a474c;border-radius:7px;background:#151d22;color:#bcc8cb;font-size:13px;font-weight:700}.transport .play{height:44px;min-width:175px;border:0;border-radius:7px;background:var(--amber);color:#17170f;font-size:14px;font-weight:790}.transport .play small{margin-left:8px;font-size:11px;font-weight:650;opacity:.66}.shortcuts{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:40px;color:#8d9c9e;font-size:11px}.shortcuts kbd{margin-right:3px;padding:4px 6px;border:1px solid #3b494d;border-radius:4px;background:#1a2429;color:#c6d0d1;font:inherit}.shortcuts .sep{color:#526064}.leave{height:39px;margin-top:49px;padding:0;border:0;border-bottom:1px solid #748286;background:transparent;color:#bec9cb;font-size:12px;font-weight:700}.leave span{padding-left:8px;color:#e8ba58}
  </style>
</head>
<body><div class="app">
  <header class="app-header">
    <div class="header-left"><div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">EDITMAP</span></div><span class="brand-sep"></span><button class="change-film" aria-label="Back to choose another film"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m7 3-5 5 5 5M2 8h12"/></svg>Change film</button><div class="project-pill">Next-Cut-v5 (1) <span class="chev">⌄</span></div><span class="save"><i></i>Unsaved</span></div>
    <nav class="mode-switch" aria-label="Workspace modes"><span class="active">Screening</span><span>Review</span><span>Studio</span><span>Explore</span></nav>
    <div class="header-right"><button class="header-action">Projector ↗</button><button class="header-action analyzing"><i></i>Analyzing…</button><button class="header-action file">File ▾</button></div>
  </header>
  <main>
    <section class="screening" aria-label="Dark Screening controls">
      <h1>Screening in progress</h1>
      <p class="lead">Screen dimmed for the theater. Use keys 1–4 to mark reactions.</p>
      <div class="keys-caption"><strong class="mono">BLIND KEYS</strong><span class="mono">Reaction auto-offset <b>−12 frames</b></span></div>
      <div class="keys"><div class="key one"><span class="mono">1</span><i></i></div><div class="key two"><span class="mono">2</span><i></i></div><div class="key three"><span class="mono">3</span><i></i></div><div class="key four"><span class="mono">4</span><i></i></div></div>
      <div class="timeline"><div class="times mono"><span class="current">00:00:00:00</span><span class="duration">00:00:51:22</span></div><div class="scrub"><div class="track"></div><div class="progress"></div><div class="playhead"></div></div><div class="transport"><button class="step mono">« &nbsp;−5s</button><button class="play">▶ &nbsp;Play <small class="mono">SPACE</small></button><button class="step mono">+5s &nbsp;»</button></div></div>
      <div class="shortcuts mono"><span><kbd>Space</kbd> play / pause</span><span class="sep">·</span><span><kbd>←</kbd><kbd>→</kbd> frame step</span><span class="sep">·</span><span><kbd>Shift</kbd> + arrows ±5s</span><span class="sep">·</span><span><kbd>Esc</kbd> review</span></div>
    </section>
    <button class="leave mono">Stop Screening &amp; Turn On Review Lights <span>→</span></button>
  </main>
</div></body>
</html>
